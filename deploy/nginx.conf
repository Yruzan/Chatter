# Put this location inside the EXISTING server block for Chatter's domain.
# Keep other domains and their existing site configuration unchanged.
# Replace the old static-only `location /` for Chatter with this location.
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;
    proxy_send_timeout 70s;
    client_max_body_size 6m;
    # No request bodies or Authorization headers should be added to access logs.
}
